<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" fill="none" stroke="#aaa" stroke-width="2">
  <!-- Body -->
  <rect x="5" y="22" width="88" height="26" rx="4" fill="#444" stroke="#888" stroke-width="1.5"/>
  <!-- Cab front -->
  <rect x="5" y="18" width="30" height="30" rx="4" fill="#3a3a3a" stroke="#888" stroke-width="1.5"/>
  <!-- Windshield -->
  <rect x="8" y="21" width="22" height="14" rx="2" fill="#1a3a5a" stroke="#5588aa" stroke-width="1"/>
  <!-- Side windows -->
  <rect x="38" y="25" width="16" height="10" rx="2" fill="#1a3a5a" stroke="#5588aa" stroke-width="1"/>
  <rect x="57" y="25" width="16" height="10" rx="2" fill="#1a3a5a" stroke="#5588aa" stroke-width="1"/>
  <rect x="76" y="25" width="10" height="10" rx="2" fill="#1a3a5a" stroke="#5588aa" stroke-width="1"/>
  <!-- VW circle -->
  <circle cx="18" cy="30" r="5" fill="#222" stroke="#aaa" stroke-width="1"/>
  <text x="18" y="33" text-anchor="middle" font-size="6" fill="#aaa" font-family="sans-serif">VW</text>
  <!-- Wheels -->
  <circle cx="22" cy="48" r="8" fill="#222" stroke="#888" stroke-width="2"/>
  <circle cx="22" cy="48" r="4" fill="#333" stroke="#666" stroke-width="1"/>
  <circle cx="78" cy="48" r="8" fill="#222" stroke="#888" stroke-width="2"/>
  <circle cx="78" cy="48" r="4" fill="#333" stroke="#666" stroke-width="1"/>
  <!-- Bumper front -->
  <rect x="3" y="38" width="5" height="6" rx="1" fill="#555" stroke="#777" stroke-width="1"/>
  <!-- Bumper rear -->
  <rect x="92" y="38" width="5" height="6" rx="1" fill="#555" stroke="#777" stroke-width="1"/>
  <!-- Headlights -->
  <rect x="4" y="26" width="4" height="5" rx="1" fill="#ffffaa" stroke="#aaa" stroke-width="0.5"/>
  <!-- Tail lights -->
  <rect x="92" y="26" width="4" height="5" rx="1" fill="#cc2222" stroke="#aaa" stroke-width="0.5"/>
  <!-- Side door line -->
  <line x1="35" y1="24" x2="35" y2="48" stroke="#666" stroke-width="1"/>
  <line x1="55" y1="24" x2="55" y2="48" stroke="#666" stroke-width="1"/>
  <line x1="74" y1="24" x2="74" y2="48" stroke="#666" stroke-width="1"/>
</svg>
