<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Óculos de Laboratório -->
  <!-- Armação -->
  <rect x="10" y="38" width="35" height="28" rx="6" fill="none" stroke="#888" stroke-width="3"/>
  <rect x="55" y="38" width="35" height="28" rx="6" fill="none" stroke="#888" stroke-width="3"/>
  <!-- Lentes transparentes -->
  <rect x="10" y="38" width="35" height="28" rx="6" fill="#aaddff" opacity="0.3"/>
  <rect x="55" y="38" width="35" height="28" rx="6" fill="#aaddff" opacity="0.3"/>
  <!-- Ponte central -->
  <path d="M45 50 Q50 47 55 50" stroke="#888" stroke-width="3" fill="none"/>
  <!-- Hastes laterais -->
  <line x1="10" y1="50" x2="2" y2="52" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="50" x2="98" y2="52" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <!-- Elástico/faixa de fixação -->
  <line x1="2" y1="52" x2="98" y2="52" stroke="#555" stroke-width="2" stroke-dasharray="4,3" opacity="0.6"/>
</svg>
