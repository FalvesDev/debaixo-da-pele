<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Gadget de Análise Química (espectômetro portátil) -->
  <!-- Corpo principal -->
  <rect x="20" y="30" width="60" height="45" rx="5" fill="#4a5a4a"/>
  <rect x="22" y="32" width="56" height="41" rx="4" fill="#3a4a3a"/>
  <!-- Tela pequena -->
  <rect x="26" y="35" width="30" height="18" rx="2" fill="#1a3a1a"/>
  <!-- Gráfico na tela (espectro) -->
  <polyline points="28,50 32,42 36,48 40,38 44,44 48,40 52,50" stroke="#44ff44" stroke-width="1.5" fill="none"/>
  <!-- Botões -->
  <circle cx="64" cy="40" r="4" fill="#ff4444"/>
  <circle cx="64" cy="50" r="4" fill="#44aaff"/>
  <circle cx="64" cy="60" r="4" fill="#ffaa44"/>
  <!-- Slot de amostra -->
  <rect x="26" y="57" width="14" height="12" rx="2" fill="#2a3a2a"/>
  <rect x="28" y="59" width="10" height="8" rx="1" fill="#1a4a1a"/>
  <!-- Indicador LED -->
  <circle cx="44" cy="63" r="2" fill="#44ff44"/>
  <!-- Sonda/antena -->
  <line x1="80" y1="30" x2="88" y2="18" stroke="#777" stroke-width="2"/>
  <circle cx="88" cy="17" r="2" fill="#888"/>
  <!-- Base/bateria -->
  <rect x="30" y="75" width="40" height="6" rx="3" fill="#555"/>
</svg>
