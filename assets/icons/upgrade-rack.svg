<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Rack bars on top -->
  <rect x="8" y="28" width="84" height="6" rx="2" fill="#cc7722" stroke="#aa5500" stroke-width="1"/>
  <rect x="8" y="42" width="84" height="6" rx="2" fill="#cc7722" stroke="#aa5500" stroke-width="1"/>
  <!-- Vertical supports -->
  <rect x="15" y="20" width="5" height="36" rx="2" fill="#888" stroke="#666" stroke-width="1"/>
  <rect x="40" y="20" width="5" height="36" rx="2" fill="#888" stroke="#666" stroke-width="1"/>
  <rect x="56" y="20" width="5" height="36" rx="2" fill="#888" stroke="#666" stroke-width="1"/>
  <rect x="81" y="20" width="5" height="36" rx="2" fill="#888" stroke="#666" stroke-width="1"/>
  <!-- Roof base -->
  <rect x="5" y="56" width="90" height="12" rx="3" fill="#3a3a3a" stroke="#888" stroke-width="2"/>
  <!-- Items on rack -->
  <rect x="22" y="16" width="14" height="12" rx="2" fill="#556644" stroke="#888" stroke-width="1"/>
  <rect x="60" y="16" width="16" height="12" rx="2" fill="#664433" stroke="#888" stroke-width="1"/>
  <!-- Mounting feet -->
  <rect x="12" y="56" width="10" height="6" rx="1" fill="#555"/>
  <rect x="78" y="56" width="10" height="6" rx="1" fill="#555"/>
</svg>
