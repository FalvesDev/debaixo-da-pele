<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Espingarda Cano Curto (Sawed-Off) -->
  <!-- Cano duplo (dois canos paralelos) -->
  <rect x="8" y="33" width="40" height="5" rx="2" fill="#8a7a6a"/>
  <rect x="8" y="39" width="40" height="5" rx="2" fill="#7a6a5a"/>
  <!-- Aba separadora entre os canos -->
  <line x1="8" y1="38" x2="48" y2="38" stroke="#5a4535" stroke-width="1"/>
  <!-- Boca dos canos (abertura) -->
  <rect x="5" y="32" width="5" height="13" rx="1" fill="#555"/>
  <!-- Corpo/ação -->
  <rect x="46" y="30" width="20" height="18" rx="3" fill="#6a5a4a"/>
  <!-- Coronha curta -->
  <path d="M66 33 Q82 35 80 45 Q79 50 68 48 L66 44 Z" fill="#5a4535"/>
  <!-- Gatilho duplo -->
  <line x1="53" y1="48" x2="56" y2="56" stroke="#888" stroke-width="2" stroke-linecap="round"/>
  <line x1="57" y1="48" x2="60" y2="55" stroke="#888" stroke-width="2" stroke-linecap="round"/>
  <!-- Guarda do gatilho -->
  <path d="M50 48 Q55 60 62 56 L62 48" stroke="#777" stroke-width="1.5" fill="none"/>
</svg>
